<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Website</title>

    <link rel="stylesheet" href="reset007.css" />
    <link rel="stylesheet" href="main007.css" />
  </head>
  <body>
    <main>
        <form action="#" method="post">
      <h1>Inscripción al torneo</h1>
      <p class="intro">Rellena el formulario para participar. Los campos con * son obligatorios.</p>

      <fieldset>
        <legend>Datos personales</legend>

        <div class="campo">
          <label for="nombre">Nombre completo *</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ej: Laura Pérez García" required>
        </div>

        <div class="campo">
          <label for="correo">Correo electrónico *</label>
          <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com" required>
        </div>

        <div class="campo">
          <label for="edad">Edad (mínimo 16)</label>
          <input type="number" id="edad" name="edad" min="16" max="120" placeholder="16">
        </div>

        <div class="campo">
          <label for="nacimiento">Fecha de nacimiento</label>
          <input type="date" id="nacimiento" name="nacimiento">
        </div>
      </fieldset>

      <fieldset>
        <legend>Cuenta de jugador</legend>

        <div class="campo">
          <label for="nickname">Nombre del jugador (nickname) *</label>
          <input type="text" id="nickname" name="nickname" minlength="3" maxlength="15" placeholder="Entre 3 y 15 caracteres" required>
        </div>

        <div class="campo">
          <label for="password">Contraseña de la cuenta *</label>
          <input type="password" id="password" name="password" required>
        </div>
      </fieldset>

      <fieldset>
        <legend>Torneo</legend>

        <div class="campo">
          <label for="juego">Videojuego del torneo</label>
          <select id="juego" name="juego">
            <option value="">Selecciona un videojuego</option>
            <option value="fifa">EA Sports FC</option>
            <option value="fortnite">Fortnite</option>
            <option value="lol">League of Legends</option>
            <option value="rocket">Rocket League</option>
            <option value="valorant">Valorant</option>
          </select>
        </div>

        <div class="grupo">
          <span class="titulo-grupo">Plataforma</span>
          <label class="opcion"><input type="radio" id="pc" name="plataforma" value="pc"> PC</label>
          <label class="opcion"><input type="radio" id="playstation" name="plataforma" value="playstation"> PlayStation</label>
          <label class="opcion"><input type="radio" id="xbox" name="plataforma" value="xbox"> Xbox</label>
        </div>

        <div class="grupo">
          <span class="titulo-grupo">Disponibilidad horaria</span>
          <label class="opcion"><input type="checkbox" id="manana" name="disponibilidad" value="manana"> Mañana</label>
          <label class="opcion"><input type="checkbox" id="tarde" name="disponibilidad" value="tarde"> Tarde</label>
          <label class="opcion"><input type="checkbox" id="noche" name="disponibilidad" value="noche"> Noche</label>
        </div>

        <div class="campo">
          <label for="comentarios">Comentarios adicionales</label>
          <textarea id="comentarios" name="comentarios" rows="4" placeholder="Cuéntanos lo que quieras..."></textarea>
        </div>
      </fieldset>

       <label class="opcion normas">
        <input type="checkbox" id="normas" name="normas" required>
        <span>Acepto las <a href="normas.html" target="_blank">normas del torneo</a> *</span>
      </label>

      <div class="botones">
        <button type="submit" class="btn-principal">Inscribirme</button>
        <button type="reset" class="btn-secundario">Limpiar formulario</button>
      </div>
    </form>
  </main>
</body>
</html>
